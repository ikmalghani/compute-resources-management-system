services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myspace
      POSTGRES_PASSWORD: myspace
      POSTGRES_DB: myspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myspace -d myspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  workspace-image:
    image: myspace-workspace:latest
    build: ./workspace
    entrypoint: ["/bin/true"]
    restart: "no"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://myspace:myspace@db:5432/myspace?schema=public
      AUTH_SECRET: myspace-dev-auth-secret-change-before-sharing
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      workspace-image:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pgdata:
